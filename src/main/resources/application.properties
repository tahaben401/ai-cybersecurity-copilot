spring.application.name=ai-cybersecurity-copilot


spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.show-sql=true

logging.level.org.springframework.security=TRACE


scanner.semgrep.enabled=true
# 15 min: a full repo with 4 security rulesets needs more than the old 5 min, or it
# times out and is silently dropped (leaving only Trivy with findings).
scanner.semgrep.timeout-seconds=900
# Run Semgrep through Docker on Windows (native CLI is broken: opentelemetry conflict).
# Requires Docker Desktop running. Set to false to use a working local `semgrep` CLI.
scanner.semgrep.use-docker=true
scanner.semgrep.docker-image=semgrep/semgrep:latest
# 'auto' removed: it fetches a tailored ruleset from semgrep.dev on every run and is
# the slowest config. These 4 curated security packs are fast and high-signal.
scanner.semgrep.rulesets=p/owasp-top-ten,p/cwe-top-25,p/security-audit,p/secrets
scanner.semgrep.excluded-dirs=node_modules,vendor,.git,build,dist,target,.idea,__pycache__
scanner.semgrep.max-file-size-bytes=1000000
scanner.semgrep.metrics-enabled=false
scanner.semgrep.max-findings=5000

scanner.codeql.enabled=true
# 30 min: DB build + analyze on a full Java repo exceeds the old 10 min and was
# timing out (then dropped). 'security-extended' only — dropping 'security-and-quality'
# removes hundreds of code-quality queries that doubled the time without security value.
scanner.codeql.timeout-seconds=1800
scanner.codeql.query-suites=security-extended
scanner.codeql.languages=java,javascript,python

# AI Service (FastAPI) — proxied by the backend so the API key stays server-side.
ai.service.base-url=${AI_SERVICE_BASE_URL:http://localhost:8000}
ai.service.api-key=${AI_SERVICE_API_KEY:}